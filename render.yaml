services:
  # =========================================================================
  # 1. NanoVision FastAPI Backend Service
  # =========================================================================
  - type: web
    name: nanovision-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

  # =========================================================================
  # 2. NanoVision Next.js Frontend Service
  # =========================================================================
  - type: web
    name: nanovision-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nanovision-backend
          property: host
        transform: https://{{.host}}/api
